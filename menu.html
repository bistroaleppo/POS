<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>قائمة الطعام | Menu</title>
  <link rel="icon" type="image/png" href="./assets/logo.png">
  <link rel="manifest" href="./manifest.json">
  <!-- Google Fonts: Cairo for primary Arabic, Playfair Display for elegant English slogan -->
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,500;1,500&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #000000;
      --text-muted: #555555;
      --accent-color: #193B23;
      --border-color: #e5e7eb;
      --font-family: 'Cairo', sans-serif;
      --font-slogan: 'Playfair Display', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 60px;
    }

    /* Header & Logo */
    header {
      text-align: center;
      padding: 50px 20px 30px;
      background: var(--bg-color);
    }

    .logo-container {
      width: 240px;
      height: auto;
      margin: 0 auto 15px;
      display: flex;
      justify-content: center;
    }

    .logo-container img {
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    h1.restaurant-name {
      font-size: 26px;
      font-weight: 800;
      color: var(--accent-color);
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    p.slogan {
      font-family: var(--font-slogan);
      font-size: 16px;
      color: var(--text-muted);
      font-style: italic;
      letter-spacing: 1px;
    }

    .divider {
      width: 30px;
      height: 2px;
      background-color: var(--accent-color);
      margin: 25px auto;
      border-radius: 1px;
    }

    /* Accordion Menu */
    .menu-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 20px 40px;
    }

    .category-accordion {
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      background-color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
      transition: border-color 0.3s ease;
    }

    .category-accordion.active {
      border-color: var(--accent-color);
    }

    .category-header {
      width: 100%;
      text-align: right;
      padding: 20px;
      background: none;
      border: none;
      font-family: var(--font-family);
      font-size: 18px;
      font-weight: 700;
      color: var(--text-color);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background-color 0.3s ease;
    }

    .category-header:hover {
      background-color: rgba(25, 59, 35, 0.02);
    }

    .category-accordion.active .category-header {
      color: var(--accent-color);
      background-color: rgba(25, 59, 35, 0.04);
    }

    .toggle-icon {
      width: 20px;
      height: 20px;
      position: relative;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .toggle-icon::before,
    .toggle-icon::after {
      content: '';
      position: absolute;
      background-color: currentColor;
      border-radius: 2px;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .toggle-icon::before {
      top: 9px;
      left: 2px;
      width: 16px;
      height: 2px;
    }

    .toggle-icon::after {
      top: 2px;
      left: 9px;
      width: 2px;
      height: 16px;
    }

    .category-accordion.active .toggle-icon {
      transform: rotate(180deg);
    }

    .category-accordion.active .toggle-icon::after {
      transform: scaleY(0);
    }

    .category-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      background-color: #ffffff;
    }

    .category-inner {
      padding: 0 20px 20px;
    }

    /* Product Items */
    .product-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 16px 0;
      border-bottom: 1px dashed var(--border-color);
    }

    .product-item:last-child {
      border-bottom: none;
    }

    .product-info {
      flex: 1;
      padding-left: 15px;
    }

    .product-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-color);
      margin-bottom: 4px;
    }

    .product-desc {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 400;
      line-height: 1.5;
    }

    .product-price {
      font-size: 15px;
      font-weight: 800;
      color: var(--accent-color);
      white-space: nowrap;
      margin-top: 2px;
    }

    /* Loading State */
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 30vh;
      color: var(--accent-color);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 2px solid rgba(25, 59, 35, 0.1);
      border-radius: 50%;
      border-top-color: var(--accent-color);
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 15px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo-container">
      <img src="./assets/logo2.png" alt="Restaurant Logo">
    </div>
    <div class="divider"></div>
  </header>

  <div id="loading-state" class="loading-container">
    <div class="spinner"></div>
    <p style="font-size: 14px; font-weight: 600;">جاري إعداد القائمة...</p>
  </div>

  <main class="menu-container" id="menu-content" style="display: none;">
    <!-- Accordion categories dynamically populated -->
  </main>

  <!-- Scripts -->
  <script src="./assets/js/firebase-app-compat.js"></script>
  <script src="./assets/js/firebase-firestore-compat.js"></script>
  <script src="database.js"></script>

  <script>
    // Register Service Worker for offline support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js');
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const db = new BistroDatabase();
        await db.init();

        // Fetch data
        const [categories, products] = await Promise.all([
          db.getCategories(),
          db.getProducts()
        ]);

        renderAccordionMenu(categories, products);

        // Hide loader, show content
        document.getElementById('loading-state').style.display = 'none';
        document.getElementById('menu-content').style.display = 'block';

      } catch (err) {
        console.error('Failed to load menu data', err);
        document.getElementById('loading-state').innerHTML = '<p style="color:red;">عذراً، حدث خطأ أثناء تحميل القائمة.</p>';
      }
    });

    function renderAccordionMenu(categories, products) {
      const menuContainer = document.getElementById('menu-content');
      menuContainer.innerHTML = '';

      // Sort categories
      categories.sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));

      categories.forEach(cat => {
        // Filter products for this category
        const catProducts = products.filter(p => p.categoryId === cat.id);
        if (catProducts.length === 0) return; // Skip empty categories

        // Create Accordion Item
        const accordion = document.createElement('div');
        accordion.className = 'category-accordion';

        // Header Button
        const header = document.createElement('button');
        header.className = 'category-header';
        header.innerHTML = `
          <span>${cat.name}</span>
          <div class="toggle-icon"></div>
        `;

        // Content Area
        const content = document.createElement('div');
        content.className = 'category-content';

        const inner = document.createElement('div');
        inner.className = 'category-inner';

        catProducts.forEach(prod => {
          const item = document.createElement('div');
          item.className = 'product-item';

          item.innerHTML = `
            <div class="product-info">
              <h3 class="product-name">${prod.name}</h3>
              ${prod.description ? `<p class="product-desc">${prod.description}</p>` : ''}
            </div>
            <div class="product-price">${prod.price.toLocaleString()} ل.س</div>
          `;
          inner.appendChild(item);
        });

        content.appendChild(inner);
        accordion.appendChild(header);
        accordion.appendChild(content);
        menuContainer.appendChild(accordion);

        // Click Event to Toggle
        header.addEventListener('click', () => {
          const isActive = accordion.classList.contains('active');

          // Close all other accordions
          document.querySelectorAll('.category-accordion').forEach(acc => {
            acc.classList.remove('active');
            acc.querySelector('.category-content').style.maxHeight = null;
          });

          // Toggle current
          if (!isActive) {
            accordion.classList.add('active');
            content.style.maxHeight = content.scrollHeight + "px";

            // Smooth scroll to top of this accordion after opening
            setTimeout(() => {
              const yOffset = -20;
              const y = accordion.getBoundingClientRect().top + window.pageYOffset + yOffset;
              window.scrollTo({ top: y, behavior: 'smooth' });
            }, 300);
          }
        });
      });
    }
  </script>
</body>

</html>
